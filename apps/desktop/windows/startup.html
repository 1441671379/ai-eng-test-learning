<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>English Learning · 启动</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#213d32;font:16px/1.7 'Microsoft YaHei',sans-serif;display:grid;place-items:center;min-height:100vh}main{max-width:700px;width:90%;padding:48px;background:white;border-radius:24px;box-shadow:0 14px 70px #213d3210}h1{font-size:28px;margin:0 0 8px}p{color:#64746c}#services{padding:0;list-style:none}li{padding:8px 0;border-bottom:1px solid #eee}button{border:0;border-radius:10px;padding:12px 20px;background:#345d49;color:white;cursor:pointer;margin:16px 8px 0 0}button.secondary{background:#edf2ed;color:#345d49}#error{white-space:pre-wrap;color:#a33232}small{color:#64746c}progress{width:100%;accent-color:#416b51}</style>
<main><h1>准备你的英语学习空间</h1><p>首次启动需要加载本地语音模型，可能需要几分钟。</p><progress id="progress" max="4" value="0"></progress><ul id="services"></ul><small id="hardware"></small><p id="error" role="alert"></p><button id="retry" hidden>重新启动后台</button><button id="logs" class="secondary">查看日志</button><p>进入软件后，请在“设置 → 模型设置”填写外部语言模型的 API Key。语音识别、发音评分和语音合成在本机运行。</p></main><script src="startup.js"></script></html>
